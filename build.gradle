plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://libraries.minecraft.net/" }
    mavenCentral()
}

loom {
    mods {
        "gatehousemc" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "org.xerial:sqlite-jdbc:${sqlite_version}"
    include "org.xerial:sqlite-jdbc:${sqlite_version}"

    implementation "net.dv8tion:JDA:${jda_version}"
    include "net.dv8tion:JDA:${jda_version}"

    // Fabric Loom's include configuration does not automatically nest JDA's
    // transitive runtime dependencies. Keep these versions explicit so the
    // published mod also works on a clean dedicated server.
    include "net.sf.trove4j:core:3.1.0"
    include "com.fasterxml.jackson.core:jackson-annotations:2.22"
    include "com.fasterxml.jackson.core:jackson-core:2.22.0"
    include "com.fasterxml.jackson.core:jackson-databind:2.22.0"
    include "com.google.crypto.tink:tink:1.18.0"
    include "com.google.code.findbugs:jsr305:3.0.2"
    include "com.google.errorprone:error_prone_annotations:2.22.0"
    include "com.google.protobuf:protobuf-java:4.28.2"
    include "com.neovisionaries:nv-websocket-client:2.14"
    include "com.squareup.okhttp3:okhttp-jvm:5.4.0"
    include "com.squareup.okio:okio-jvm:3.17.0"
    include "org.jetbrains.kotlin:kotlin-stdlib:2.2.21"
    include "org.jetbrains:annotations:13.0"
    include "club.minnced:opus-java:1.1.1"
    include "club.minnced:opus-java-api:1.1.1"
    include "club.minnced:opus-java-natives:1.1.1"
    include "org.apache.commons:commons-collections4:4.5.0"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "loader_version": project.loader_version, "fabric_version": project.fabric_version, "minecraft_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { name -> "${name}_${project.archives_base_name}" }
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
