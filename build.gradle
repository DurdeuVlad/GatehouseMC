buildscript {
    repositories {
        maven { url = uri("https://maven.fabricmc.net/") }
        mavenCentral()
    }
    dependencies {
        if (!project.providers.gradleProperty("enableForge").isPresent()) {
            classpath "net.fabricmc:fabric-loom:${loom_version}"
        }
    }
}

plugins { id "maven-publish" }

def forgeLane = providers.gradleProperty("enableForge").isPresent()
if (!forgeLane) apply plugin: "fabric-loom"

version = project.mod_version
group = project.maven_group

if (!forgeLane) {
    apply plugin: "base"
    apply plugin: "java"

    base {
        archivesName = project.archives_base_name
    }

    repositories {
        maven { url = "https://libraries.minecraft.net/" }
        mavenCentral()
    }

    loom {
        mods {
            "gatehousemc" {
                sourceSet sourceSets.main
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

        implementation "org.xerial:sqlite-jdbc:${sqlite_version}"
        include "org.xerial:sqlite-jdbc:${sqlite_version}"

        implementation "net.dv8tion:JDA:${jda_version}"
        include "net.dv8tion:JDA:${jda_version}"
        implementation "org.slf4j:slf4j-api:${slf4j_version}"
        include "org.slf4j:slf4j-api:${slf4j_version}"

        testImplementation platform("org.junit:junit-bom:${junit_version}")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
            expand "version": project.version, "loader_version": project.loader_version, "fabric_version": project.fabric_version, "minecraft_version": project.minecraft_version
        }
    }
}

if (!forgeLane) {
    tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
    }

    java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    }

    jar {
    from("LICENSE") {
        rename { name -> "${name}_${project.archives_base_name}" }
    }
    }

    test {
    useJUnitPlatform()
    }

    publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
}
