name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build and test
        run: bash ./gradlew clean test build --stacktrace
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-${{ github.ref_name }}
          path: build/libs/gatehousemc-*.jar
          if-no-files-found: error

  compatibility-matrix:
    name: Compatibility ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { branch: '1.14.4', minecraft: '1.14.4', java: '17' }
          - { branch: '1.15.2', minecraft: '1.15.2', java: '17' }
          - { branch: '1.16.5', minecraft: '1.16.5', java: '17' }
          - { branch: '1.17.1', minecraft: '1.17.1', java: '17' }
          - { branch: '1.18.2', minecraft: '1.18.2', java: '17' }
          - { branch: '1.19.2', minecraft: '1.19.2', java: '17' }
          - { branch: '1.19.4', minecraft: '1.19.4', java: '17' }
          - { branch: '1.20.1', minecraft: '1.20.1', java: '17' }
          - { branch: '1.20.4', minecraft: '1.20.4', java: '17' }
          - { branch: '1.20.6', minecraft: '1.20.6', java: '21' }
          - { branch: '1.21.1', minecraft: '1.21.1', java: '21' }
          - { branch: '1.21.4', minecraft: '1.21.4', java: '21' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ matrix.branch }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build and test compatibility branch
        run: bash ./gradlew clean test build --stacktrace

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build mod
        run: bash ./gradlew build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Start clean 1.21.1 dedicated server and run smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')" = "1.21.1"
          server_dir="$RUNNER_TEMP/gatehousemc-e2e-server"
          mkdir -p "$server_dir/mods"
          curl --fail --silent --show-error --location \
            "https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar" \
            --output "$server_dir/fabric-installer.jar"
          pushd "$server_dir"
          java -jar fabric-installer.jar server \
            -mcversion 1.21.1 -loader 0.19.5 -downloadMinecraft
          popd
          fabric_api_version=$(grep '^fabric_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          fabric_api_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api/$fabric_api_version" \
            -type f -name 'fabric-api-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$fabric_api_jar"
          cp "$fabric_api_jar" "$server_dir/mods/fabric-api.jar"
          mod_jar=$(find build/libs -maxdepth 1 -type f -name 'gatehousemc-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$mod_jar"
          cp "$mod_jar" "$server_dir/mods/"
          printf 'eula=true\n' > "$server_dir/eula.txt"
          cat > "$server_dir/server.properties" <<'EOF'
          online-mode=false
          white-list=true
          enforce-whitelist=true
          enforce-secure-profile=false
          server-port=25565
          EOF
          pushd "$server_dir"
          java -jar fabric-server-launch.jar nogui > server.log 2>&1 &
          server_pid=$!
          popd
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if grep -q 'Done (' "$server_dir/server.log"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_dir/server.log"
              exit 1
            fi
            sleep 2
          done
          grep -q 'Done (' "$server_dir/server.log" || { cat "$server_dir/server.log"; exit 1; }
          MC_EXPECTED_STATUS=rejected MC_HOST=127.0.0.1 MC_PORT=25565 npm --prefix tools/e2e run smoke

      - name: Upload dedicated-server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-e2e-server-log-${{ github.run_id }}
          path: ${{ runner.temp }}/gatehousemc-e2e-server/server.log
          if-no-files-found: warn
