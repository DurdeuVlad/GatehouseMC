name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: '21'

jobs:
  build-and-test:
    name: Build + unit/component tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (cache keyed by immutable project files only)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew clean test build --stacktrace

      - name: Record test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-jar-${{ github.run_id }}
          path: build/libs/gatehousemc-*.jar
          if-no-files-found: error
          retention-days: 7

  e2e-dedicated-server:
    name: Dedicated-server E2E (real Fabric server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (cache keyed by immutable project files only)
        uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download built mod jar from build job
        uses: actions/download-artifact@v4
        with:
          name: gatehousemc-jar-${{ github.run_id }}
          path: build/libs

      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e

      - name: Run E2E — unknown player is rejected and request created (E2E-01)
        run: npm run e2e
        working-directory: tools/e2e
        env:
          MC_EXPECTED_STATUS: rejected
          E2E_SERVER_PORT: '25599'

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_id }}
          path: |
            build/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7
