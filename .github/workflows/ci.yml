name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric-and-neoforge:
    name: Fabric 1.21.1 + NeoForge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, and validate artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          bash ./gradlew clean test build :platform-neoforge:build --stacktrace
          mkdir -p dist
          python tools/release/validate_artifact.py \
            --artifact "build/libs/gatehousemc-${version}.jar" \
            --loader fabric --minecraft 1.21.1 --version "$version"
          python tools/release/validate_artifact.py \
            --artifact "platform-neoforge/build/libs/gatehousemc-neoforge-mc1.21.1-${version}.jar" \
            --loader neoforge --minecraft 1.21.1 --version "$version"
          cp "build/libs/gatehousemc-${version}.jar" "dist/gatehousemc-fabric-mc1.21.1-${version}.jar"
          cp "platform-neoforge/build/libs/gatehousemc-neoforge-mc1.21.1-${version}.jar" \
            "dist/gatehousemc-neoforge-mc1.21.1-${version}.jar"
      - name: Upload Fabric and NeoForge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-fabric-neoforge-${{ github.run_id }}
          path: dist/*.jar
          if-no-files-found: error

  forge:
    name: Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # ForgeGradle 6 rejects Gradle 9+, so this lane intentionally uses 8.8.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and validate Forge artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mkdir -p dist
          gradle -PenableForge :platform-forge:build --stacktrace
          artifact="platform-forge/build/libs/gatehousemc-forge-mc1.20.1-${version}-all.jar"
          python tools/release/validate_artifact.py \
            --artifact "$artifact" --loader forge --minecraft 1.20.1 --version "$version"
          cp "$artifact" "dist/gatehousemc-forge-mc1.20.1-${version}.jar"
      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-forge-${{ github.run_id }}
          path: dist/*.jar
          if-no-files-found: error

  fabric-e2e-smoke:
    name: Fabric 1.21.1 dedicated-server smoke
    runs-on: ubuntu-latest
    needs: fabric-and-neoforge
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/support/fabric/1.21.1' ||
      github.ref == 'refs/heads/1.21.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Fabric artifact
        run: bash ./gradlew build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Run clean Fabric server smoke
        shell: bash
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          bash tools/e2e/run-clean-server-smoke.sh fabric .e2e-server 25565 \
            "build/libs/gatehousemc-${version}.jar" 1.21.1

  forge-e2e-smoke:
    name: Forge 1.20.1 dedicated-server smoke
    runs-on: ubuntu-latest
    needs: forge
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/support/forge/1.20.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Forge artifact
        run: gradle -PenableForge :platform-forge:build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Run clean Forge server smoke
        shell: bash
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          bash tools/e2e/run-clean-server-smoke.sh forge .e2e-server 25566 \
            "platform-forge/build/libs/gatehousemc-forge-mc1.20.1-${version}-all.jar" 1.20.1

  neoforge-e2e-smoke:
    name: NeoForge 1.21.1 dedicated-server smoke
    runs-on: ubuntu-latest
    needs: fabric-and-neoforge
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/support/neoforge/1.21.1' ||
      github.ref == 'refs/heads/1.21.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build NeoForge artifact
        run: bash ./gradlew :platform-neoforge:build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Run clean NeoForge server smoke
        shell: bash
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          bash tools/e2e/run-clean-server-smoke.sh neoforge .e2e-server 25567 \
            "platform-neoforge/build/libs/gatehousemc-neoforge-mc1.21.1-${version}.jar" 1.21.1
