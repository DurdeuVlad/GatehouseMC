name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build and test
        run: ./gradlew clean test build --stacktrace
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-${{ github.ref_name }}
          path: build/libs/gatehousemc-*.jar
          if-no-files-found: error

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.21.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build mod
        run: ./gradlew build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Run E2E smoke (reject assertion)
        run: npm run smoke
        working-directory: tools/e2e
        env:
          MC_EXPECTED_STATUS: rejected
