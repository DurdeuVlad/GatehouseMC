name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build and test
        run: bash ./gradlew clean test build --stacktrace
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-${{ github.run_id }}
          path: build/libs/gatehousemc-*.jar
          if-no-files-found: error

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.21.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build mod
        run: bash ./gradlew build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Start clean dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .e2e-server/mods
          curl --fail --silent --show-error --location \
            "https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar" \
            --output .e2e-server/fabric-installer.jar
          java -jar .e2e-server/fabric-installer.jar server \
            -dir .e2e-server -mcversion 1.21.1 -loader 0.19.5 -downloadMinecraft
          fabric_api_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api/0.116.17+1.21.1" \
            -type f -name 'fabric-api-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$fabric_api_jar"
          cp "$fabric_api_jar" .e2e-server/mods/fabric-api.jar
          cp build/libs/gatehousemc-1.0.1.jar .e2e-server/mods/
          printf 'eula=true\n' > .e2e-server/eula.txt
          cat > .e2e-server/server.properties <<'EOF'
          online-mode=false
          white-list=true
          enforce-secure-profile=false
          server-port=25565
          EOF
          java -jar .e2e-server/fabric-server-launch.jar nogui > .e2e-server/server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 90); do
            if grep -q 'Done (' .e2e-server/server.log; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat .e2e-server/server.log
              exit 1
            fi
            sleep 2
          done
          grep -q 'Done (' .e2e-server/server.log || { cat .e2e-server/server.log; kill "$server_pid" 2>/dev/null || true; exit 1; }
          MC_EXPECTED_STATUS=rejected npm --prefix tools/e2e run smoke
          result=$?
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          exit "$result"


