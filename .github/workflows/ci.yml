name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabric-and-neoforge:
    name: Fabric 1.21.1 + NeoForge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: bash ./gradlew clean test build :platform-neoforge:build --stacktrace
      - name: Validate Fabric artifact
        run: >-
          python tools/release/validate_artifact.py
          --artifact build/libs/gatehousemc-1.1.0.jar
          --loader fabric --minecraft 1.21.1 --version 1.1.0
      - name: Validate NeoForge artifact
        run: >-
          python tools/release/validate_artifact.py
          --artifact platform-neoforge/build/libs/gatehousemc-neoforge-mc1.21.1-1.1.0.jar
          --loader neoforge --minecraft 1.21.1 --version 1.1.0
      - name: Upload Fabric and NeoForge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-fabric-neoforge-${{ github.run_id }}
          path: |
            build/libs/gatehousemc-1.1.0.jar
            platform-neoforge/build/libs/gatehousemc-neoforge-mc1.21.1-1.1.0.jar
          if-no-files-found: error

  forge:
    name: Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # ForgeGradle 6 rejects Gradle 9+, so this lane intentionally uses 8.8.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge artifact
        run: gradle -PenableForge :platform-forge:build --stacktrace
      - name: Validate Forge artifact
        run: >-
          python tools/release/validate_artifact.py
          --artifact platform-forge/build/libs/gatehousemc-forge-mc1.20.1-1.1.0-all.jar
          --loader forge --minecraft 1.20.1 --version 1.1.0
      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-forge-${{ github.run_id }}
          path: platform-forge/build/libs/gatehousemc-forge-mc1.20.1-1.1.0-all.jar
          if-no-files-found: error

  fabric-e2e-smoke:
    name: Fabric 1.21.1 dedicated-server smoke
    runs-on: ubuntu-latest
    needs: fabric-and-neoforge
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.21.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Fabric artifact
        run: bash ./gradlew build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Run clean Fabric server smoke
        run: >-
          bash tools/e2e/run-clean-server-smoke.sh fabric .e2e-server 25565
          build/libs/gatehousemc-1.1.0.jar 1.21.1

  forge-e2e-smoke:
    name: Forge 1.20.1 dedicated-server smoke
    runs-on: ubuntu-latest
    needs: forge
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.21.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Forge artifact
        run: gradle -PenableForge :platform-forge:build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Run clean Forge server smoke
        run: >-
          bash tools/e2e/run-clean-server-smoke.sh forge .e2e-server 25566
          platform-forge/build/libs/gatehousemc-forge-mc1.20.1-1.1.0-all.jar 1.20.1

  neoforge-e2e-smoke:
    name: NeoForge 1.21.1 dedicated-server smoke
    runs-on: ubuntu-latest
    needs: fabric-and-neoforge
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.21.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build NeoForge artifact
        run: bash ./gradlew :platform-neoforge:build
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - name: Run clean NeoForge server smoke
        run: >-
          bash tools/e2e/run-clean-server-smoke.sh neoforge .e2e-server 25567
          platform-neoforge/build/libs/gatehousemc-neoforge-mc1.21.1-1.1.0.jar 1.21.1
