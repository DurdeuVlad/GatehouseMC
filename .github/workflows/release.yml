name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing bare version tag to rebuild and republish'
        required: true
        type: string
      publish_storefronts:
        description: 'Publish this version to CurseForge and optional Modrinth'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify combined release
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          release_sha=$(git rev-parse "$tag^{commit}")
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release tag is not reachable from origin/main." >&2
            exit 1
          }

          mod_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          python tools/release/resolve_release.py \
            --tag "$tag" \
            --mod-version "$mod_version" \
            --output release-manifest.json

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' release-manifest.json)" >> "$GITHUB_OUTPUT"
          for loader in fabric forge neoforge; do
            prefix="${loader}_"
            echo "${prefix}minecraft=$(jq -r --arg loader "$loader" '.targets[] | select(.loader == $loader) | .minecraft' release-manifest.json)" >> "$GITHUB_OUTPUT"
            echo "${prefix}java=$(jq -r --arg loader "$loader" '.targets[] | select(.loader == $loader) | .java' release-manifest.json)" >> "$GITHUB_OUTPUT"
            echo "${prefix}artifact=$(jq -r --arg loader "$loader" '.targets[] | select(.loader == $loader) | .artifact' release-manifest.json)" >> "$GITHUB_OUTPUT"
            echo "${prefix}artifact_name=$(jq -r --arg loader "$loader" '.targets[] | select(.loader == $loader) | .artifact_name' release-manifest.json)" >> "$GITHUB_OUTPUT"
            echo "${prefix}dependencies=$(jq -r --arg loader "$loader" '.targets[] | select(.loader == $loader) | .dependencies' release-manifest.json)" >> "$GITHUB_OUTPUT"
          done

      - name: Set up Java 21 for Fabric and NeoForge
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle wrapper lane
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric and NeoForge artifacts
        run: bash ./gradlew clean test build :platform-neoforge:build --stacktrace

      - name: Set up Java 17 for Forge
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Forge Gradle 8.8 lane
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge artifact
        run: gradle -PenableForge :core:test :platform-forge:build --stacktrace

      - name: Set up Node.js for dedicated-server smoke
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and stage all release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          : > release-assets/checksums.txt

          while IFS= read -r target; do
            loader=$(jq -r '.loader' <<< "$target")
            minecraft=$(jq -r '.minecraft' <<< "$target")
            artifact=$(jq -r '.artifact' <<< "$target")
            artifact_name=$(jq -r '.artifact_name' <<< "$target")
            test -f "$artifact"
            python tools/release/validate_artifact.py \
              --artifact "$artifact" \
              --loader "$loader" \
              --minecraft "$minecraft" \
              --version "${{ steps.target.outputs.version }}"
            cp "$artifact" "release-assets/$artifact_name"
            sha256sum "release-assets/$artifact_name" >> release-assets/checksums.txt
          done < <(jq -c '.targets[]' release-manifest.json)

          cat release-assets/checksums.txt

      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e

      - name: Set up Java 21 for Fabric and NeoForge smoke
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Fabric and NeoForge clean dedicated-server smoke gates
        shell: bash
        run: |
          set -euo pipefail
          port=25565
          while IFS= read -r target; do
            loader=$(jq -r '.loader' <<< "$target")
            minecraft=$(jq -r '.minecraft' <<< "$target")
            artifact=$(jq -r '.artifact' <<< "$target")
            bash tools/e2e/run-clean-server-smoke.sh \
              "$loader" \
              ".e2e-release-$loader" \
              "$port" \
              "$artifact" \
              "$minecraft"
            port=$((port + 1))
          done < <(jq -c '.targets[] | select(.loader == "fabric" or .loader == "neoforge")' release-manifest.json)

      - name: Set up Java 17 for Forge smoke
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Forge clean dedicated-server smoke gate
        shell: bash
        run: |
          set -euo pipefail
          target=$(jq -c '.targets[] | select(.loader == "forge")' release-manifest.json)
          minecraft=$(jq -r '.minecraft' <<< "$target")
          artifact=$(jq -r '.artifact' <<< "$target")
          bash tools/e2e/run-clean-server-smoke.sh \
            forge \
            .e2e-release-forge \
            25567 \
            "$artifact" \
            "$minecraft"

      - name: Upload dedicated-server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-${{ steps.target.outputs.version }}-e2e-${{ github.run_id }}
          path: .e2e-release-*/server.log
          if-no-files-found: warn

      - name: Create combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GatehouseMC ${{ steps.target.outputs.version }}
          tag_name: ${{ steps.target.outputs.tag }}
          body_path: CHANGELOG.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Fabric to CurseForge
        if: github.event_name != 'workflow_dispatch' || inputs.publish_storefronts
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-assets/${{ steps.target.outputs.fabric_artifact_name }}
          name: GatehouseMC ${{ steps.target.outputs.version }} (Fabric, Minecraft ${{ steps.target.outputs.fabric_minecraft }})
          version: ${{ steps.target.outputs.version }}-fabric-mc${{ steps.target.outputs.fabric_minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          environment: dedicated-server
          game-versions: ${{ steps.target.outputs.fabric_minecraft }}
          java: ${{ steps.target.outputs.fabric_java }}
          dependencies: ${{ steps.target.outputs.fabric_dependencies }}
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish Forge to CurseForge
        if: github.event_name != 'workflow_dispatch' || inputs.publish_storefronts
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-assets/${{ steps.target.outputs.forge_artifact_name }}
          name: GatehouseMC ${{ steps.target.outputs.version }} (Forge, Minecraft ${{ steps.target.outputs.forge_minecraft }})
          version: ${{ steps.target.outputs.version }}-forge-mc${{ steps.target.outputs.forge_minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: forge
          environment: dedicated-server
          game-versions: ${{ steps.target.outputs.forge_minecraft }}
          java: ${{ steps.target.outputs.forge_java }}
          dependencies: ${{ steps.target.outputs.forge_dependencies }}
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish NeoForge to CurseForge
        if: github.event_name != 'workflow_dispatch' || inputs.publish_storefronts
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-assets/${{ steps.target.outputs.neoforge_artifact_name }}
          name: GatehouseMC ${{ steps.target.outputs.version }} (NeoForge, Minecraft ${{ steps.target.outputs.neoforge_minecraft }})
          version: ${{ steps.target.outputs.version }}-neoforge-mc${{ steps.target.outputs.neoforge_minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          environment: dedicated-server
          game-versions: ${{ steps.target.outputs.neoforge_minecraft }}
          java: ${{ steps.target.outputs.neoforge_java }}
          dependencies: ${{ steps.target.outputs.neoforge_dependencies }}
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

      - name: Detect optional Modrinth credentials
        id: modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          PUBLISH_MODRINTH: ${{ vars.PUBLISH_MODRINTH }}
        run: |
          if [ "${PUBLISH_MODRINTH,,}" = "true" ] && [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "project_id=$MODRINTH_PROJECT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Fabric to Modrinth
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_storefronts) && steps.modrinth.outputs.available == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.modrinth.outputs.project_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/${{ steps.target.outputs.fabric_artifact_name }}
          name: GatehouseMC ${{ steps.target.outputs.version }} (Fabric, Minecraft ${{ steps.target.outputs.fabric_minecraft }})
          version: ${{ steps.target.outputs.version }}-fabric-mc${{ steps.target.outputs.fabric_minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          environment: dedicated-server
          game-versions: ${{ steps.target.outputs.fabric_minecraft }}
          java: ${{ steps.target.outputs.fabric_java }}
          dependencies: ${{ steps.target.outputs.fabric_dependencies }}
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish Forge to Modrinth
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_storefronts) && steps.modrinth.outputs.available == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.modrinth.outputs.project_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/${{ steps.target.outputs.forge_artifact_name }}
          name: GatehouseMC ${{ steps.target.outputs.version }} (Forge, Minecraft ${{ steps.target.outputs.forge_minecraft }})
          version: ${{ steps.target.outputs.version }}-forge-mc${{ steps.target.outputs.forge_minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: forge
          environment: dedicated-server
          game-versions: ${{ steps.target.outputs.forge_minecraft }}
          java: ${{ steps.target.outputs.forge_java }}
          dependencies: ${{ steps.target.outputs.forge_dependencies }}
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

      - name: Publish NeoForge to Modrinth
        if: (github.event_name != 'workflow_dispatch' || inputs.publish_storefronts) && steps.modrinth.outputs.available == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.modrinth.outputs.project_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/${{ steps.target.outputs.neoforge_artifact_name }}
          name: GatehouseMC ${{ steps.target.outputs.version }} (NeoForge, Minecraft ${{ steps.target.outputs.neoforge_minecraft }})
          version: ${{ steps.target.outputs.version }}-neoforge-mc${{ steps.target.outputs.neoforge_minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          environment: dedicated-server
          game-versions: ${{ steps.target.outputs.neoforge_minecraft }}
          java: ${{ steps.target.outputs.neoforge_java }}
          dependencies: ${{ steps.target.outputs.neoforge_dependencies }}
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
