name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string
      publish:
        description: Publish the already verified artifacts to Modrinth and CurseForge
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-fabric-neoforge:
    name: Build and validate Fabric + NeoForge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash ./gradlew clean test build :platform-neoforge:build --stacktrace
      - name: Validate and stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mkdir -p dist
          python tools/release/validate_artifact.py \
            --artifact "build/libs/gatehousemc-${version}.jar" \
            --loader fabric --minecraft 1.21.1 --version "$version"
          python tools/release/validate_artifact.py \
            --artifact "platform-neoforge/build/libs/gatehousemc-neoforge-mc1.21.1-${version}.jar" \
            --loader neoforge --minecraft 1.21.1 --version "$version"
          cp "build/libs/gatehousemc-${version}.jar" "dist/gatehousemc-fabric-mc1.21.1-${version}.jar"
          cp "platform-neoforge/build/libs/gatehousemc-neoforge-mc1.21.1-${version}.jar" \
            "dist/gatehousemc-neoforge-mc1.21.1-${version}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-fabric-neoforge
          path: dist/*.jar
          if-no-files-found: error

  build-forge:
    name: Build and validate Forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # ForgeGradle 6 does not support Gradle 9+.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle -PenableForge :platform-forge:build --stacktrace
      - name: Validate and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mkdir -p dist
          python tools/release/validate_artifact.py \
            --artifact "platform-forge/build/libs/gatehousemc-forge-mc1.20.1-${version}-all.jar" \
            --loader forge --minecraft 1.20.1 --version "$version"
          cp "platform-forge/build/libs/gatehousemc-forge-mc1.20.1-${version}-all.jar" \
            "dist/gatehousemc-forge-mc1.20.1-${version}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-forge
          path: dist/*.jar
          if-no-files-found: error

  dedicated-server-e2e:
    name: Clean dedicated-server E2E for all release artifacts
    needs: [build-fabric-neoforge, build-forge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run clean Fabric server smoke
        run: >-
          bash tools/e2e/run-clean-server-smoke.sh fabric .e2e-fabric 25565
          "$(find dist -maxdepth 1 -name 'gatehousemc-fabric-mc1.21.1-*.jar' -print -quit)" 1.21.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run clean Forge server smoke
        run: >-
          bash tools/e2e/run-clean-server-smoke.sh forge .e2e-forge 25566
          "$(find dist -maxdepth 1 -name 'gatehousemc-forge-mc1.20.1-*.jar' -print -quit)" 1.20.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run clean NeoForge server smoke
        run: >-
          bash tools/e2e/run-clean-server-smoke.sh neoforge .e2e-neoforge 25567
          "$(find dist -maxdepth 1 -name 'gatehousemc-neoforge-mc1.21.1-*.jar' -print -quit)" 1.21.1

  github-release:
    name: Create GitHub release
    needs: [build-fabric-neoforge, build-forge, dedicated-server-e2e]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-info.outputs.version }}
      tag: ${{ steps.release-info.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release identity
        id: release-info
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          expected=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            tag="v${version}"
          else
            tag="$REF_NAME"
            version="${tag#v}"
          fi
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          test "$version" = "$expected" || {
            echo "Release $version does not match mod_version $expected" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/*.jar > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GatehouseMC ${{ steps.release-info.outputs.version }}
          tag_name: ${{ steps.release-info.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            dist/*.jar
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish verified artifacts
    needs: github-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require publishing credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo 'Missing MODRINTH_TOKEN.' >&2; exit 1; }
          test -n "$CURSEFORGE_TOKEN" || { echo 'Missing CURSEFORGE_TOKEN.' >&2; exit 1; }
      # Keep each loader/version pair as a separate platform version. This
      # prevents Modrinth/CurseForge from inferring the wrong loader metadata.
      - name: Publish Fabric 1.21.1
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: gatehousemc
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/gatehousemc-fabric-mc1.21.1-${{ needs.github-release.outputs.version }}.jar
          name: GatehouseMC ${{ needs.github-release.outputs.version }} — Fabric 1.21.1
          version: ${{ needs.github-release.outputs.version }}+fabric.1.21.1
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          environment: dedicated-server
          game-versions: 1.21.1
          java: 21
          dependencies: fabric-api(required)
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
      - name: Publish Forge 1.20.1
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: gatehousemc
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/gatehousemc-forge-mc1.20.1-${{ needs.github-release.outputs.version }}.jar
          name: GatehouseMC ${{ needs.github-release.outputs.version }} — Forge 1.20.1
          version: ${{ needs.github-release.outputs.version }}+forge.1.20.1
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: forge
          environment: dedicated-server
          game-versions: 1.20.1
          java: 17
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
      - name: Publish NeoForge 1.21.1
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: gatehousemc
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/gatehousemc-neoforge-mc1.21.1-${{ needs.github-release.outputs.version }}.jar
          name: GatehouseMC ${{ needs.github-release.outputs.version }} — NeoForge 1.21.1
          version: ${{ needs.github-release.outputs.version }}+neoforge.1.21.1
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          environment: dedicated-server
          game-versions: 1.21.1
          java: 21
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

  announce:
    name: Announce release
    needs: github-release
    if: needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.github-release.outputs.version }}
      RELEASE_TAG: ${{ needs.github-release.outputs.tag }}
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.github-release.outputs.tag }}
      MODRINTH_URL: https://modrinth.com/mod/gatehousemc
      CURSEFORGE_URL: https://www.curseforge.com/minecraft/mc-mods/gatehousemc
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
      TELEGRAM_RELEASE_BOT_TOKEN: ${{ secrets.TELEGRAM_RELEASE_BOT_TOKEN }}
      TELEGRAM_RELEASE_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
    steps:
      - name: Write release announcement summary
        run: |
          {
            echo "## GatehouseMC ${RELEASE_VERSION} staged"
            echo
            echo "Loader targets: Fabric 1.21.1, Forge 1.20.1, NeoForge 1.21.1"
            echo
            echo "- GitHub: ${RELEASE_URL}"
            echo "- Modrinth: ${MODRINTH_URL}"
            echo "- CurseForge: ${CURSEFORGE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Announce to Discord webhook
        if: env.DISCORD_RELEASE_WEBHOOK_URL != ''
        run: |
          python - <<'PY' > "$RUNNER_TEMP/discord-release.json"
          import json, os
          version = os.environ["RELEASE_VERSION"]
          targets = "Fabric 1.21.1, Forge 1.20.1, NeoForge 1.21.1"
          message = (
              f"🎉 GatehouseMC {version} is staged for {targets}.\n"
              f"GitHub: {os.environ['RELEASE_URL']}\n"
              f"Modrinth: {os.environ['MODRINTH_URL']}\n"
              f"CurseForge: {os.environ['CURSEFORGE_URL']}"
          )
          print(json.dumps({"content": message}))
          PY
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/discord-release.json" \
            "$DISCORD_RELEASE_WEBHOOK_URL"
      - name: Announce to Telegram
        if: env.TELEGRAM_RELEASE_BOT_TOKEN != '' || env.TELEGRAM_RELEASE_CHAT_ID != ''
        run: |
          test -n "$TELEGRAM_RELEASE_BOT_TOKEN" || { echo 'TELEGRAM_RELEASE_BOT_TOKEN is missing.' >&2; exit 1; }
          test -n "$TELEGRAM_RELEASE_CHAT_ID" || { echo 'TELEGRAM_RELEASE_CHAT_ID is missing.' >&2; exit 1; }
          python - <<'PY' > "$RUNNER_TEMP/telegram-release.json"
          import json, os
          version = os.environ["RELEASE_VERSION"]
          print(json.dumps({
              "chat_id": os.environ["TELEGRAM_RELEASE_CHAT_ID"],
              "text": (
                  f"🎉 GatehouseMC {version} is staged for Fabric 1.21.1, Forge 1.20.1, and NeoForge 1.21.1.\n"
                  f"GitHub: {os.environ['RELEASE_URL']}"
              ),
              "disable_web_page_preview": True,
          }))
          PY
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/telegram-release.json" \
            "https://api.telegram.org/bot${TELEGRAM_RELEASE_BOT_TOKEN}/sendMessage"
