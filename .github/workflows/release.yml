name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Extract version info
        id: version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          CLEAN_VER="${TAG_NAME#v}"
          MC_VER=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "mc_version=${MC_VER}" >> $GITHUB_OUTPUT

      - name: Build and test mod
        run: ./gradlew clean test build --stacktrace

      - name: Compute SHA-256 Checksums
        run: |
          cd build/libs
          sha256sum gatehousemc-*.jar > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GatehouseMC ${{ steps.version.outputs.clean_version }} (${{ steps.version.outputs.mc_version }})
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            build/libs/gatehousemc-*.jar
            build/libs/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/gatehousemc-*.jar
          name: GatehouseMC ${{ steps.version.outputs.clean_version }} (${{ steps.version.outputs.mc_version }})
          version: ${{ steps.version.outputs.clean_version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: ${{ steps.version.outputs.mc_version }}
          dependencies: |
            fabric-api(required)
