name: Release

on:
  push:
    tags:
      - 'v*-mc*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v (for example 1.0.2)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source is main
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main" || {
              echo "Manual releases must be dispatched from main." >&2
              exit 1
            }
          else
            git fetch origin main --no-tags
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Tag commit is not reachable from main." >&2
              exit 1
            }
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Extract version info
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          MOD_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MC_VER=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CLEAN_VER="${INPUT_VERSION:-$MOD_VER}"
            TAG_NAME="v${CLEAN_VER}-mc${MC_VER}"
          else
            TAG_NAME="$REF_NAME"
            if [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)-mc([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              CLEAN_VER="${BASH_REMATCH[1]}"
              TAG_MC_VER="${BASH_REMATCH[3]}"
            else
              echo "Release tags must use v<version>-mc<minecraft-version>." >&2
              exit 1
            fi
            if [ "$TAG_MC_VER" != "$MC_VER" ]; then
              echo "Tag Minecraft target $TAG_MC_VER does not match $MC_VER." >&2
              exit 1
            fi
          fi
          if [ "$CLEAN_VER" != "$MOD_VER" ]; then
            echo "Release version $CLEAN_VER does not match mod_version $MOD_VER." >&2
            exit 1
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "mc_version=${MC_VER}" >> $GITHUB_OUTPUT

      - name: Build and test mod
        run: bash ./gradlew clean test build --stacktrace

      - name: Validate artifact identity
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.clean_version }}
          MINECRAFT_VERSION: ${{ steps.version.outputs.mc_version }}
        run: |
          set -euo pipefail
          source_jar="build/libs/gatehousemc-${RELEASE_VERSION}.jar"
          test -f "$source_jar"
          metadata=$(unzip -p "$source_jar" fabric.mod.json)
          test "$(jq -r '.id' <<<"$metadata")" = "gatehousemc"
          test "$(jq -r '.version' <<<"$metadata")" = "$RELEASE_VERSION"
          test "$(jq -r '.depends.minecraft' <<<"$metadata")" = "$MINECRAFT_VERSION"
          cp "$source_jar" "build/libs/gatehousemc-${MINECRAFT_VERSION}-${RELEASE_VERSION}.jar"

      - name: Compute SHA-256 Checksums
        run: |
          cd build/libs
          sha256sum "gatehousemc-${{ steps.version.outputs.mc_version }}-${{ steps.version.outputs.clean_version }}.jar" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GatehouseMC ${{ steps.version.outputs.clean_version }} (${{ steps.version.outputs.mc_version }})
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            build/libs/gatehousemc-${{ steps.version.outputs.mc_version }}-${{ steps.version.outputs.clean_version }}.jar
            build/libs/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/gatehousemc-${{ steps.version.outputs.mc_version }}-${{ steps.version.outputs.clean_version }}.jar
          name: GatehouseMC ${{ steps.version.outputs.clean_version }} (${{ steps.version.outputs.mc_version }})
          version: ${{ steps.version.outputs.clean_version }}+${{ steps.version.outputs.mc_version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          environment: dedicated-server
          game-versions: ${{ steps.version.outputs.mc_version }}
          java: '21'
          dependencies: |
            fabric-api(required)
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
