name: Release

on:
  push:
    tags:
      - 'v*-fabric-mc*'
      - 'v*-forge-mc*'
      - 'v*-neoforge-mc*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing loader-qualified tag to rebuild and republish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify release target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          release_sha=$(git rev-parse "$tag^{commit}")
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release tag is not reachable from origin/main." >&2
            exit 1
          }

          mod_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          python tools/release/resolve_target.py \
            --tag "$tag" \
            --mod-version "$mod_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.target.outputs.java }}

      - name: Set up Gradle wrapper lane
        if: steps.target.outputs.gradle == 'wrapper'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Forge Gradle 8.8 lane
        if: steps.target.outputs.gradle == '8.8'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Set up Node.js for dedicated-server smoke
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build selected loader artifact
        shell: bash
        env:
          LOADER: ${{ steps.target.outputs.loader }}
        run: |
          set -euo pipefail
          case "$LOADER" in
            fabric)
              bash ./gradlew clean test build --stacktrace
              ;;
            forge)
              gradle -PenableForge :platform-forge:build --stacktrace
              ;;
            neoforge)
              bash ./gradlew clean test build :platform-neoforge:build --stacktrace
              ;;
            *)
              echo "Unsupported release loader: $LOADER" >&2
              exit 2
              ;;
          esac

      - name: Validate and checksum selected artifact
        shell: bash
        env:
          ARTIFACT: ${{ steps.target.outputs.artifact }}
          ARTIFACT_NAME: ${{ steps.target.outputs.artifact_name }}
          LOADER: ${{ steps.target.outputs.loader }}
          MINECRAFT: ${{ steps.target.outputs.minecraft }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          test -f "$ARTIFACT"
          python tools/release/validate_artifact.py \
            --artifact "$ARTIFACT" \
            --loader "$LOADER" \
            --minecraft "$MINECRAFT" \
            --version "$VERSION"
          mkdir -p release-assets
          cp "$ARTIFACT" "release-assets/$ARTIFACT_NAME"
          sha256sum "release-assets/$ARTIFACT_NAME" > release-assets/checksums.txt
          cat release-assets/checksums.txt

      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e

      - name: Run clean dedicated-server smoke gate
        shell: bash
        env:
          LOADER: ${{ steps.target.outputs.loader }}
          MINECRAFT: ${{ steps.target.outputs.minecraft }}
          ARTIFACT: ${{ steps.target.outputs.artifact }}
        run: |
          set -euo pipefail
          bash tools/e2e/run-clean-server-smoke.sh \
            "$LOADER" \
            ".e2e-release-$LOADER" \
            25565 \
            "$ARTIFACT" \
            "$MINECRAFT"

      - name: Upload dedicated-server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatehousemc-${{ steps.target.outputs.loader }}-e2e-${{ github.run_id }}
          path: .e2e-release-${{ steps.target.outputs.loader }}/server.log
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GatehouseMC ${{ steps.target.outputs.version }} (${{ steps.target.outputs.loader }}, Minecraft ${{ steps.target.outputs.minecraft }})
          tag_name: ${{ steps.target.outputs.tag }}
          body_path: CHANGELOG.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-assets/${{ steps.target.outputs.artifact_name }}
          name: GatehouseMC ${{ steps.target.outputs.version }} (${{ steps.target.outputs.loader }}, Minecraft ${{ steps.target.outputs.minecraft }})
          version: ${{ steps.target.outputs.version }}-${{ steps.target.outputs.loader }}-mc${{ steps.target.outputs.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: ${{ steps.target.outputs.loader }}
          environment: dedicated-server
          game-versions: ${{ steps.target.outputs.minecraft }}
          java: ${{ steps.target.outputs.java }}
          dependencies: ${{ steps.target.outputs.dependencies }}
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

      - name: Detect optional Modrinth credentials
        id: modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          if [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Modrinth
        if: steps.modrinth.outputs.available == 'true'
        # Modrinth is an optional mirror; a storefront/API issue must not
        # invalidate the required CurseForge publication or GitHub Release.
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/${{ steps.target.outputs.artifact_name }}
          name: GatehouseMC ${{ steps.target.outputs.version }} (${{ steps.target.outputs.loader }}, Minecraft ${{ steps.target.outputs.minecraft }})
          version: ${{ steps.target.outputs.version }}-${{ steps.target.outputs.loader }}-mc${{ steps.target.outputs.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: ${{ steps.target.outputs.loader }}
          environment: dedicated-server
          game-versions: ${{ steps.target.outputs.minecraft }}
          java: ${{ steps.target.outputs.java }}
          dependencies: ${{ steps.target.outputs.dependencies }}
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
