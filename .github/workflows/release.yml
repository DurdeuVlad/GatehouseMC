name: Release

on:
  push:
    tags:
      - 'v*-*-mc*'
  workflow_dispatch:
    inputs:
      version:
        description: Mod version without the leading v
        required: true
        type: string
      loader:
        description: Loader target to release
        required: true
        type: choice
        options:
          - fabric
          - forge
          - neoforge
      minecraft_version:
        description: Exact Minecraft version for the loader target
        required: true
        type: string
      publish:
        description: Publish the verified artifact to Modrinth and CurseForge
        required: true
        default: false
        type: boolean

concurrency:
  group: gatehousemc-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve loader-qualified release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      loader: ${{ steps.resolve.outputs.loader }}
      minecraft: ${{ steps.resolve.outputs.minecraft }}
      branch: ${{ steps.resolve.outputs.branch }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag or dispatch inputs
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LOADER: ${{ inputs.loader }}
          INPUT_MINECRAFT: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          expected=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)-(fabric|forge|neoforge)-mc([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
              version="${BASH_REMATCH[1]}"
              loader="${BASH_REMATCH[3]}"
              minecraft="${BASH_REMATCH[4]}"
            else
              echo "Invalid release tag: $tag" >&2
              echo 'Expected v<mod-version>-<loader>-mc<minecraft-version>.' >&2
              exit 1
            fi
          else
            version="$INPUT_VERSION"
            loader="$INPUT_LOADER"
            minecraft="$INPUT_MINECRAFT"
            tag="v${version}-${loader}-mc${minecraft}"
          fi

          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          test "$version" = "$expected" || {
            echo "Release $version does not match mod_version $expected" >&2
            exit 1
          }

          case "$loader:$minecraft" in
            fabric:1.21.1) branch='support/fabric/1.21.1' ;;
            forge:1.20.1) branch='support/forge/1.20.1' ;;
            neoforge:1.21.1) branch='support/neoforge/1.21.1' ;;
            *)
              echo "Unsupported release target: $loader $minecraft" >&2
              echo 'Add the target to .github/support-matrix.yml and this resolver after live verification.' >&2
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = "push" ]; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            branch_commit=$(git rev-parse "refs/remotes/origin/$branch^{commit}")
            test "$tag_commit" = "$branch_commit" || {
              echo "Tag $tag must point at the tip of $branch." >&2
              echo "tag=$tag_commit branch=$branch_commit" >&2
              exit 1
            }
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-modern:
    name: Build Fabric or NeoForge target
    needs: resolve-release
    if: >-
      needs.resolve-release.result == 'success' &&
      (needs.resolve-release.outputs.loader == 'fabric' || needs.resolve-release.outputs.loader == 'neoforge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate target
        shell: bash
        env:
          TARGET_LOADER: ${{ needs.resolve-release.outputs.loader }}
          TARGET_MINECRAFT: ${{ needs.resolve-release.outputs.minecraft }}
          TARGET_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$TARGET_LOADER" = fabric ]; then
            bash ./gradlew clean test build --stacktrace
            artifact="build/libs/gatehousemc-${TARGET_VERSION}.jar"
          else
            bash ./gradlew clean test build :platform-neoforge:build --stacktrace
            artifact="platform-neoforge/build/libs/gatehousemc-neoforge-mc${TARGET_MINECRAFT}-${TARGET_VERSION}.jar"
          fi
          python tools/release/validate_artifact.py \
            --artifact "$artifact" --loader "$TARGET_LOADER" \
            --minecraft "$TARGET_MINECRAFT" --version "$TARGET_VERSION"
          cp "$artifact" "dist/gatehousemc-${TARGET_LOADER}-mc${TARGET_MINECRAFT}-${TARGET_VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.resolve-release.outputs.loader }}-${{ needs.resolve-release.outputs.minecraft }}
          path: dist/*.jar
          if-no-files-found: error

  build-forge:
    name: Build Forge target
    needs: resolve-release
    if: >-
      needs.resolve-release.result == 'success' &&
      needs.resolve-release.outputs.loader == 'forge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and validate Forge target
        shell: bash
        env:
          TARGET_MINECRAFT: ${{ needs.resolve-release.outputs.minecraft }}
          TARGET_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle -PenableForge :platform-forge:build --stacktrace
          artifact="platform-forge/build/libs/gatehousemc-forge-mc${TARGET_MINECRAFT}-${TARGET_VERSION}-all.jar"
          python tools/release/validate_artifact.py \
            --artifact "$artifact" --loader forge \
            --minecraft "$TARGET_MINECRAFT" --version "$TARGET_VERSION"
          cp "$artifact" "dist/gatehousemc-forge-mc${TARGET_MINECRAFT}-${TARGET_VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-forge-${{ needs.resolve-release.outputs.minecraft }}
          path: dist/*.jar
          if-no-files-found: error

  dedicated-server-e2e:
    name: Clean dedicated-server E2E for tagged target
    needs: [resolve-release, build-modern, build-forge]
    if: >-
      always() && needs.resolve-release.result == 'success' &&
      (needs.build-modern.result == 'success' || needs.build-forge.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install E2E dependencies
        run: npm ci
        working-directory: tools/e2e
      - uses: actions/setup-java@v5
        if: needs.resolve-release.outputs.loader != 'forge'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        if: needs.resolve-release.outputs.loader == 'forge'
        with:
          distribution: temurin
          java-version: '17'
      - name: Run clean target server smoke
        shell: bash
        env:
          TARGET_LOADER: ${{ needs.resolve-release.outputs.loader }}
          TARGET_MINECRAFT: ${{ needs.resolve-release.outputs.minecraft }}
        run: |
          set -euo pipefail
          artifact=$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)
          test -n "$artifact"
          case "$TARGET_LOADER" in
            fabric) port=25565 ;;
            forge) port=25566 ;;
            neoforge) port=25567 ;;
          esac
          bash tools/e2e/run-clean-server-smoke.sh \
            "$TARGET_LOADER" .e2e-server "$port" "$artifact" "$TARGET_MINECRAFT"

  github-release:
    name: Create loader-qualified GitHub release
    needs: [resolve-release, build-modern, build-forge, dedicated-server-e2e]
    if: >-
      always() && needs.resolve-release.result == 'success' &&
      needs.dedicated-server-e2e.result == 'success' &&
      (needs.build-modern.result == 'success' || needs.build-forge.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.resolve-release.outputs.version }}
      loader: ${{ needs.resolve-release.outputs.loader }}
      minecraft: ${{ needs.resolve-release.outputs.minecraft }}
      tag: ${{ needs.resolve-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Compute checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.jar' | wc -l)" -eq 1
          sha256sum dist/*.jar > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GatehouseMC ${{ needs.resolve-release.outputs.version }} — ${{ needs.resolve-release.outputs.loader }} ${{ needs.resolve-release.outputs.minecraft }}
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            dist/*.jar
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish verified loader/version artifact
    needs: github-release
    if: >-
      needs.github-release.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.github-release.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require publishing credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo 'Missing MODRINTH_TOKEN.' >&2; exit 1; }
          test -n "$CURSEFORGE_TOKEN" || { echo 'Missing CURSEFORGE_TOKEN.' >&2; exit 1; }
      - name: Publish Fabric file
        if: needs.github-release.outputs.loader == 'fabric'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: gatehousemc
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/gatehousemc-fabric-mc${{ needs.github-release.outputs.minecraft }}-${{ needs.github-release.outputs.version }}.jar
          name: GatehouseMC ${{ needs.github-release.outputs.version }} — Fabric ${{ needs.github-release.outputs.minecraft }}
          version: ${{ needs.github-release.outputs.version }}+fabric.${{ needs.github-release.outputs.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          environment: dedicated-server
          game-versions: ${{ needs.github-release.outputs.minecraft }}
          java: 21
          dependencies: fabric-api(required)
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
      - name: Publish Forge file
        if: needs.github-release.outputs.loader == 'forge'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: gatehousemc
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/gatehousemc-forge-mc${{ needs.github-release.outputs.minecraft }}-${{ needs.github-release.outputs.version }}.jar
          name: GatehouseMC ${{ needs.github-release.outputs.version }} — Forge ${{ needs.github-release.outputs.minecraft }}
          version: ${{ needs.github-release.outputs.version }}+forge.${{ needs.github-release.outputs.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: forge
          environment: dedicated-server
          game-versions: ${{ needs.github-release.outputs.minecraft }}
          java: 17
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
      - name: Publish NeoForge file
        if: needs.github-release.outputs.loader == 'neoforge'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: gatehousemc
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/gatehousemc-neoforge-mc${{ needs.github-release.outputs.minecraft }}-${{ needs.github-release.outputs.version }}.jar
          name: GatehouseMC ${{ needs.github-release.outputs.version }} — NeoForge ${{ needs.github-release.outputs.minecraft }}
          version: ${{ needs.github-release.outputs.version }}+neoforge.${{ needs.github-release.outputs.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          environment: dedicated-server
          game-versions: ${{ needs.github-release.outputs.minecraft }}
          java: 21
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000

  announce:
    name: Announce loader-qualified release
    needs: github-release
    if: needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.github-release.outputs.version }}
      RELEASE_LOADER: ${{ needs.github-release.outputs.loader }}
      RELEASE_MINECRAFT: ${{ needs.github-release.outputs.minecraft }}
      RELEASE_TAG: ${{ needs.github-release.outputs.tag }}
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.github-release.outputs.tag }}
      MODRINTH_URL: https://modrinth.com/mod/gatehousemc
      CURSEFORGE_URL: https://www.curseforge.com/minecraft/mc-mods/gatehousemc
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
      TELEGRAM_RELEASE_BOT_TOKEN: ${{ secrets.TELEGRAM_RELEASE_BOT_TOKEN }}
      TELEGRAM_RELEASE_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
    steps:
      - name: Write release announcement summary
        run: |
          {
            echo "## GatehouseMC ${RELEASE_VERSION} — ${RELEASE_LOADER} ${RELEASE_MINECRAFT} staged"
            echo
            echo "- GitHub: ${RELEASE_URL}"
            echo "- Modrinth: ${MODRINTH_URL}"
            echo "- CurseForge: ${CURSEFORGE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Announce to Discord webhook
        if: env.DISCORD_RELEASE_WEBHOOK_URL != ''
        run: |
          python - <<'PY' > "$RUNNER_TEMP/discord-release.json"
          import json, os
          target = f"{os.environ['RELEASE_LOADER']} {os.environ['RELEASE_MINECRAFT']}"
          message = (
              f"🎉 GatehouseMC {os.environ['RELEASE_VERSION']} is staged for {target}.\n"
              f"GitHub: {os.environ['RELEASE_URL']}\n"
              f"Modrinth: {os.environ['MODRINTH_URL']}\n"
              f"CurseForge: {os.environ['CURSEFORGE_URL']}"
          )
          print(json.dumps({"content": message}))
          PY
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/discord-release.json" \
            "$DISCORD_RELEASE_WEBHOOK_URL"
      - name: Announce to Telegram
        if: env.TELEGRAM_RELEASE_BOT_TOKEN != '' || env.TELEGRAM_RELEASE_CHAT_ID != ''
        run: |
          test -n "$TELEGRAM_RELEASE_BOT_TOKEN" || { echo 'TELEGRAM_RELEASE_BOT_TOKEN is missing.' >&2; exit 1; }
          test -n "$TELEGRAM_RELEASE_CHAT_ID" || { echo 'TELEGRAM_RELEASE_CHAT_ID is missing.' >&2; exit 1; }
          python - <<'PY' > "$RUNNER_TEMP/telegram-release.json"
          import json, os
          target = f"{os.environ['RELEASE_LOADER']} {os.environ['RELEASE_MINECRAFT']}"
          print(json.dumps({
              "chat_id": os.environ["TELEGRAM_RELEASE_CHAT_ID"],
              "text": (
                  f"🎉 GatehouseMC {os.environ['RELEASE_VERSION']} is staged for {target}.\n"
                  f"GitHub: {os.environ['RELEASE_URL']}"
              ),
              "disable_web_page_preview": True,
          }))
          PY
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/telegram-release.json" \
            "https://api.telegram.org/bot${TELEGRAM_RELEASE_BOT_TOKEN}/sendMessage"
