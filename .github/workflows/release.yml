name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v (for example 1.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Extract version info
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          MOD_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              CLEAN_VER="$INPUT_VERSION"
            else
              CLEAN_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
            fi
            TAG_NAME="v${CLEAN_VER}"
          else
            TAG_NAME="$REF_NAME"
            CLEAN_VER="${TAG_NAME#v}"
          fi
          MC_VER=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          case "$MC_VER" in
            1.21.1|1.21.4) ;;
            *)
              echo "Release publishing is guarded to the Java 21 targets 1.21.1 and 1.21.4; $MC_VER remains blocked by compatibility issues #50/#51." >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$CLEAN_VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version: $CLEAN_VER" >&2
            exit 1
          fi
          if [ "$CLEAN_VER" != "$MOD_VER" ]; then
            echo "Release version $CLEAN_VER does not match mod_version $MOD_VER" >&2
            exit 1
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "mc_version=${MC_VER}" >> $GITHUB_OUTPUT

      - name: Validate publishing secrets
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo 'Missing MODRINTH_TOKEN repository secret.' >&2; exit 1; }
          test -n "$CURSEFORGE_TOKEN" || { echo 'Missing CURSEFORGE_TOKEN repository secret.' >&2; exit 1; }

      - name: Build and test mod
        run: bash ./gradlew clean test build --stacktrace

      - name: Compute SHA-256 Checksums
        run: |
          cd build/libs
          sha256sum "gatehousemc-${{ steps.version.outputs.clean_version }}.jar" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GatehouseMC ${{ steps.version.outputs.clean_version }} (${{ steps.version.outputs.mc_version }})
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            build/libs/gatehousemc-${{ steps.version.outputs.clean_version }}.jar
            build/libs/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: gatehousemc
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1689020
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/gatehousemc-${{ steps.version.outputs.clean_version }}.jar
          name: GatehouseMC ${{ steps.version.outputs.clean_version }} (${{ steps.version.outputs.mc_version }})
          version: ${{ steps.version.outputs.clean_version }}+${{ steps.version.outputs.mc_version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          environment: dedicated-server
          game-versions: ${{ steps.version.outputs.mc_version }}
          java: 21
          dependencies: |
            fabric-api(required)
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000
